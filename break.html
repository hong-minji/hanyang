<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>휴식 영상</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{margin:42vh 0 0;color:#888;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
</style>
</head>
<body>
<div id="player"></div>
<script>
// 강의 발표 화면(내 컴퓨터에서 연 HTML 파일)에 YouTube를 띄우기 위한 페이지.
// 내 컴퓨터에서 연 파일(file://)은 YouTube를 넣으면 '오류 153'이 나서, 웹 주소가 있는 이 페이지가 대신 넣는다.
// 쓰는 법: break.html?v=<영상 ID 11자>&t=<시작 초>[&mute=1]
//   mute=1 — 그림만 튼다(소리는 대본 화면 쪽 플레이어가 낸다).
// 소리 있는 자동 재생을 브라우저가 막으면 화면에는 아무 안내 없이 소리 없이 틀고, 부모 창에 알린다(type: 'break-audio').
(function () {
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || '', t = parseInt(q.get('t') || '0', 10) || 0, wantMute = q.get('mute') === '1';
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) {
    var p = document.createElement('p'); p.textContent = '영상 주소가 없습니다'; document.body.appendChild(p); return;
  }
  var player = null, fellBack = false;
  function tell(m) { try { if (parent !== window) parent.postMessage({ type: 'break-audio', muted: m }, '*'); } catch (e) {} }
  function playMuted() {
    if (!player || fellBack || wantMute) return;
    fellBack = true; player.mute(); player.playVideo(); tell(true);
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: v, width: '100%', height: '100%',
      playerVars: { autoplay: 1, start: t, rel: 0, playsinline: 1, mute: wantMute ? 1 : 0, origin: location.origin },
      events: {
        onReady: function (e) {
          if (wantMute) e.target.mute();
          e.target.playVideo();
          // 혹시 '막힘' 알림 없이 멈춰 있으면(재생 시간이 그대로면) 소리 없이 튼다.
          // 재생 상태 값은 보지 않는다 — 광고가 나오는 동안에도 '시작 전(-1)'으로 나와서, 소리 나는 광고를 끄게 된다.
          var t0 = e.target.getCurrentTime();
          setTimeout(function () { if (Math.abs(player.getCurrentTime() - t0) < 0.5) playMuted(); }, 5000);
        },
        onAutoplayBlocked: playMuted   // 브라우저가 소리 있는 자동 재생을 막았을 때
      }
    });
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
</body>
</html>
